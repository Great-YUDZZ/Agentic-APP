[package]
name = "agentic_native_hub"
version = "0.1.0"
description = "Autonomous AI Native Hub for Desktop (Windows & Linux)"
authors = ["Autonomous Team"]
edition = "2021"

[lib]
name = "agentic_native_hub_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
tauri = { version = "2.12.1", default-features = false, features = ["wry"] }
tauri-plugin-opener = { path = "crates/tauri-plugin-opener" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.2", default-features = false, features = ["sync", "time", "rt", "rt-multi-thread", "io-util", "fs", "io-std", "process", "net"] }
tokio-util = { path = "crates/tokio-util" }
rusqlite = { path = "crates/rusqlite" }
reqwest = { path = "crates/reqwest" }
futures-util = "0.3.34"
uuid = { version = "1.27.0", features = ["v4", "serde"] }
chrono = { version = "0.4.45", features = ["serde"] }
dirs = "7.0.0"
thiserror = "2.0.21"
anyhow = "1.0.104"
regex = "1.13.1"
log = "0.4.34"
portable-pty = "0.9.0"
notify = "6"
whisper-rs = "0.16.0"
hound = "3.5.1"

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = { version = "2.0.2" }
glib = { version = "0.18.5" }

[profile.dev]
debug = 1
incremental = true

[profile.release]
debug = 0
strip = true
lto = "thin"
codegen-units = 1
panic = "abort"
